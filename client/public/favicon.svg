<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fundo com gradiente azul ao roxo -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo retangular com cantos arredondados -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#gradient)" />
  
  <!-- Caixa de papelão (pacote) em contorno branco -->
  <!-- Face frontal da caixa -->
  <rect x="8" y="12" width="16" height="12" fill="none" stroke="white" stroke-width="1.5" rx="1"/>
  
  <!-- Face superior da caixa -->
  <path d="M8 12 L16 8 L24 12" fill="none" stroke="white" stroke-width="1.5"/>
  
  <!-- Face lateral direita -->
  <path d="M24 12 L24 24 L16 20 L16 8" fill="none" stroke="white" stroke-width="1.5"/>
  
  <!-- Linhas de fita na caixa -->
  <line x1="8" y1="18" x2="24" y2="18" stroke="white" stroke-width="1" opacity="0.8"/>
  <line x1="16" y1="12" x2="16" y2="24" stroke="white" stroke-width="1" opacity="0.8"/>
  
  <!-- Detalhes da fita vertical -->
  <rect x="15.5" y="12" width="1" height="12" fill="white" opacity="0.6"/>
  
  <!-- Detalhes da fita horizontal -->
  <rect x="8" y="17.5" width="16" height="1" fill="white" opacity="0.6"/>
</svg> 